apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-data
  namespace: longhorn-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-r2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: longhorn-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: writer }
  template:
    metadata:
      labels: { app: writer }
    spec:
      containers:
        - name: writer
          image: busybox:1.37
          command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-data
