apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"         # prima di tutto: gli altri vogliono certificati
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # eliminando l'Application si eliminano anche le risorse
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io        # sorgente 1: chart ufficiale
      chart: cert-manager
      targetRevision: v1.21.2                    # versione pinnata (verificata con helm search)
      helm:
        valueFiles:
          - $values/platform/cert-manager/values.yaml
    - repoURL: https://github.com/Likh0Rux/lab-gitops.git   # sorgente 2: i nostri values
      targetRevision: main
      ref: values                                # rende il repo referenziabile come $values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                     # CRD grandi: niente limite dei 262144 byte
