apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"        
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # eliminando l'Application si eliminano anche le risorse
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io       
      chart: cert-manager
      targetRevision: v1.21.2                   
      helm:
        valueFiles:
          - $values/platform/cert-manager/values.yaml
    - repoURL: https://github.com/Likh0Rux/lab-gitops.git  
      targetRevision: main
      ref: values                               
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                   
