apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lldap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"         # dopo Longhorn e Sealed Secrets, prima di Dex
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Likh0Rux/lab-gitops.git
    targetRevision: main
    path: platform/lldap
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
