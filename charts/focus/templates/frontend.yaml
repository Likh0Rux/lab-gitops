apiVersion: v1
kind: ConfigMap
metadata:
  name: focus-frontend
  labels: {{- include "focus.labels" . | nindent 4 }}
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: focus-frontend
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: focus-frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: focus-frontend }
      annotations:
        checksum/html: {{ .Files.Get "files/index.html" | sha256sum | trunc 16 }}   # nuova pagina = restart automatico
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: {{ .Values.frontend.image }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: {{- include "focus.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }          # nginx scrive pid e cache qui (root fs in sola lettura)
      volumes:
        - name: html
          configMap: { name: focus-frontend }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: focus-frontend
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: focus-frontend }
  ports: [{ name: http, port: 8080, targetPort: http }]
