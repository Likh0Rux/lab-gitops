# Database dei pomodori. StatefulSet: identità stabile e volume legato al pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: focus-db
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  serviceName: focus-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: focus-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: focus-db }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70                  # utente "postgres" nell'immagine alpine
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=20"]   # tuning per la RAM della VM
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # sottocartella: la radice del volume contiene lost+found
          envFrom:
            - secretRef: { name: {{ .Values.postgres.secretName }} }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: focus-db
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: focus-db }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
