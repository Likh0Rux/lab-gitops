# oauth2-proxy: fa il login OIDC con Dex e inoltra a frontend/API solo gli utenti
# che appartengono ai gruppi autorizzati, aggiungendo gli header con utente e gruppi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: focus-oauth2-proxy
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: focus-oauth2-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: focus-oauth2-proxy }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.oidc.issuer }}
            - --client-id={{ .Values.oidc.clientID }}
            - --redirect-url=https://{{ .Values.host }}/oauth2/callback
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            {{- range .Values.oidc.allowedGroups }}
            - --allowed-group={{ . }}
            {{- end }}
            - --email-domain=*
            - --provider-ca-file=/etc/lab-ca/ca.crt     # fiducia nel certificato di Dex (CA del lab)
            - --code-challenge-method=S256              # PKCE
            - --cookie-secure=true
            - --reverse-proxy=true                      # dietro Traefik
            - --skip-provider-button=true               # va dritto al login di Dex
            - --pass-user-headers=true                  # X-Forwarded-User/Email/Groups verso l'app
            - --upstream=http://focus-api:8080/api/
            - --upstream=http://focus-frontend:8080/
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.secretName }}, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.secretName }}, key: cookie-secret } }
          ports: [{ name: http, containerPort: 4180 }]
          readinessProbe:
            httpGet: { path: /ping, port: http }
          securityContext: {{- include "focus.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: lab-ca, mountPath: /etc/lab-ca, readOnly: true }
      volumes:
        - name: lab-ca
          secret:
            secretName: focus-tls       # il certificato dell'Ingress, emesso da lab-ca, contiene anche ca.crt
            items: [{ key: ca.crt, path: ca.crt }]
---
apiVersion: v1
kind: Service
metadata:
  name: focus-oauth2-proxy
  labels: {{- include "focus.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: focus-oauth2-proxy }
  ports: [{ name: http, port: 4180, targetPort: http }]
