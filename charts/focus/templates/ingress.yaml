# Tutto il traffico entra da oauth2-proxy: nessuna strada per raggiungere l'app senza login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: focus
  labels: {{- include "focus.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: focus-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: focus-oauth2-proxy
                port: { name: http }
