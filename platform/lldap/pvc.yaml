apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-data
  namespace: identity
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard         # local-path di kind (la classe si chiama "standard"); Longhorn nella fase Longhorn
  resources:
    requests:
      storage: 1Gi                   # SQLite di LLDAP: bastano pochi MB
