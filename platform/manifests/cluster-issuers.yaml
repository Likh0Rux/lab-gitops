# 1) Issuer autofirmato
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
name: selfsigned
spec:
selfSigned: {}
---
# 2) Certificato della CA del lab, firmato dall'issuer sopra
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
name: lab-ca
namespace: cert-manager 
spec:
isCA: true # può firmare altri certificati
commonName: Academy Lab CA
secretName: lab-ca-secret 
duration: 87600h
privateKey:
algorithm: ECDSA
size: 256
issuerRef:
name: selfsigned
kind: ClusterIssuer
group: cert-manager.io
---
# 3) Issuer che firma i certificati di tutti i servizi con la CA del lab
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
name: lab-ca
spec:
ca:
secretName: lab-ca-secret
