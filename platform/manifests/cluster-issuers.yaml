# 1) Issuer autofirmato: serve solo a creare la CA del lab
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 2) Certificato della CA del lab, firmato dall'issuer sopra
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager          # i ClusterIssuer di tipo CA leggono il secret da qui
spec:
  isCA: true                       # può firmare altri certificati
  commonName: Academy Lab CA
  secretName: lab-ca-secret        # chiave privata + certificato della CA
  duration: 87600h                 # 10 anni (solo lab)
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# 3) Issuer che firma i certificati di tutti i servizi con la CA del lab
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca-secret

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Academy Lab Intermediate CA
  secretName: lab-intermediate-ca-secret
  duration: 8760h       # 1 anno
  renewBefore: 720h     # rinnovo 30 giorni prima
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: lab-ca        # la firma la CA attuale, che diventa la root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-intermediate
spec:
  ca:
    secretName: lab-intermediate-ca-secret