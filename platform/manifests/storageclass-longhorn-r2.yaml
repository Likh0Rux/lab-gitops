apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2
provisioner: driver.longhorn.io    # driver CSI di Longhorn
allowVolumeExpansion: true         # PVC espandibili a caldo
reclaimPolicy: Delete              # PVC cancellato = volume cancellato
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"            # una replica per nodo (ne abbiamo 2)
  staleReplicaTimeout: "30"        # minuti prima di scartare una replica irraggiungibile
  dataLocality: "best-effort"      # prova a tenere una replica sul nodo del pod
  fsType: "ext4"
