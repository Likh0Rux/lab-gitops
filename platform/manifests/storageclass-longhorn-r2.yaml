apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
name: longhorn-r2
provisioner: driver.longhorn.io
allowVolumeExpansion: true 
reclaimPolicy: Delete 
volumeBindingMode: Immediate
parameters:
numberOfReplicas: "2" 
staleReplicaTimeout: "30" # minuti prima di scartare una replica irraggiungibile
dataLocality: "best-effort" 
fsType: "ext4"

